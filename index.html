<!DOCTYPE html>
<html>
    <head> 
        <title>A-Frame Primitives</title>
        <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
            <a-box
            color="brown"
            position="0 0 0"
            rotation="0 0 0"
            width="5"

color="orange"
position="0 2 0"
radius="1"
>

>
</a-cylinder>
<a-cone
color="yellow"
position="-.5 2.2 .8"
rotation="1 3 5"

height=".2"
>
</a-cone>
